name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "src/website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

# Requer Pages já ativado no repo (Settings → Pages → Source: GitHub Actions).
# O GITHUB_TOKEN não consegue criar o site Pages (enablement exige PAT com admin).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: src/website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

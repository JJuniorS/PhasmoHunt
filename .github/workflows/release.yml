name: App release

# Cria uma GitHub Release (changelog / histórico) quando uma tag v* é enviada.
# O binário fica em provedor externo; atualize src/website/release.json antes ou depois.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          {
            echo "## Phasmo Hunt ${VERSION}"
            echo ""
            if [[ -f CHANGELOG.md ]]; then
              # Extrai a seção da versão no CHANGELOG (entre ## [x.y.z] e a próxima ##)
              awk -v ver="$VERSION" '
                $0 ~ "^## \\[" ver "\\]" {grab=1; next}
                grab && $0 ~ /^## / {exit}
                grab {print}
              ' CHANGELOG.md
            fi
            echo ""
            echo "---"
            echo ""
            echo "**Download:** binário no provedor externo configurado em [\`src/website/release.json\`](https://github.com/${{ github.repository }}/blob/${TAG}/src/website/release.json) (site do projeto)."
            echo ""
            echo "Código-fonte e notas de versão: este release no GitHub."
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Phasmo Hunt ${{ steps.ver.outputs.version }}
          body_path: release-body.md
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
